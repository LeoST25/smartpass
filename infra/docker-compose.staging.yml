services:
  db:
    image: postgis/postgis:16-3.4
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - smartpass_staging
    deploy:
      resources:
        limits:
          memory: 1G

  otp:
    volumes:
      - ./otp-data:/var/opentripplanner
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - smartpass_staging
    deploy:
      resources:
        limits:
          memory: 4G

  otp-build:
    volumes:
      - ./otp-data:/var/opentripplanner
    networks:
      - smartpass_staging
    deploy:
      resources:
        limits:
          memory: 8G

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    image: smartpass:app-staging
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smartpass}
      DB_USER: ${DB_USER:-smartpass_user}
      DB_PASS: ${DB_PASS:-changeme}
      OTP_GRAPHQL_URL: http://otp:8080/otp/gtfs/v1
      STREAMLIT_ENV: staging
    ports:
      - "8502:8501"
    restart: unless-stopped
    networks:
      - smartpass_staging
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  smartpass_staging:
    name: smartpass_staging
    driver: bridge

volumes:
  pgdata_staging:
