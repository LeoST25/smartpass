services:
  db:
    image: postgis/postgis:15-3.3
    container_name: smartpass_db
    restart: always
    environment:
      POSTGRES_USER: smartpass_user
      POSTGRES_PASSWORD: smartpass_password
      POSTGRES_DB: smartpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
