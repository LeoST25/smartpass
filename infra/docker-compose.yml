services:
  otp-build:
    image: docker.io/opentripplanner/opentripplanner:2.7.0
    volumes:
      - ./otp-data:/var/opentripplanner
    command: --build --save

  otp:
    image: docker.io/opentripplanner/opentripplanner:2.7.0
    container_name: smartpass_otp
    ports:
      - "8080:8080"
    volumes:
      - ./otp-data:/var/opentripplanner
    command: --load --serve
