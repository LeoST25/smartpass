services:
  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-smartpass}
      POSTGRES_USER: ${DB_USER:-smartpass_user}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
    restart: "no"
    networks:
      - smartpass

  otp:
    ports:
      - "8080:8080"
    restart: "no"
    networks:
      - smartpass

  # API FastAPI (porta 8000) — dev com hot-reload
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    image: smartpass:api-dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smartpass}
      DB_USER: ${DB_USER:-smartpass_user}
      DB_PASS: ${DB_PASS:-changeme}
      OTP_GRAPHQL_URL: http://otp:8080/otp/gtfs/v1
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DEBUG: "1"
    volumes:
      - ../src:/app/src
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    restart: "no"
    networks:
      - smartpass

  # Frontend React (Vite dev server com HMR)
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    image: smartpass:web-dev
    environment:
      - DOCKER_ENV=true
      - VITE_API_BASE_URL=/api/v1
    ports:
      - "3000:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    restart: "no"
    networks:
      - smartpass

networks:
  smartpass:
    name: smartpass_dev
