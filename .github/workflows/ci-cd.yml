name: CI/CD SmartPass

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  test:
    name: Test & Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 || true

      - name: Lint - syntax check
        run: |
          python -m compileall src/
          flake8 src/ --select=E9,F63,F7,F82 --show-source || true

      - name: Run tests (non-integration)
        run: pytest -v -k "not integration"

      - name: Validate Docker build
        run: docker build -t smartpass:ci .

  deploy-staging:
    name: Deploy Staging
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/smartpass || cd /opt/smartpass
            git fetch origin staging
            git checkout staging
            git pull origin staging
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.staging.yml pull || true
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.staging.yml up -d --build
            docker system prune -f || true

  deploy-prod:
    name: Deploy Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/smartpass || cd /opt/smartpass
            git fetch origin main
            git checkout main
            git pull origin main
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml pull || true
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
            docker system prune -f || true
